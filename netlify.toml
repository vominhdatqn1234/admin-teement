# Netlify config — ADMIN site (base directory = admin-portal)
# admin-portal giờ có package.json độc lập -> build riêng, không cần deps ở root.
[build]
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  CI = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

# SPA fallback cho react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
